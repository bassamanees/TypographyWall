# يرفق فيديو الشرح بصفحة النسخة (Release) الحالية كلما تغيّر الفيديو في المستودع، بلا إعادة بناء التطبيق.
name: Attach explainer video

on:
  push:
    branches: [main, master]
    paths: ["docs/TypographyWall_explainer.mp4"]
  workflow_dispatch:

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          files: docs/TypographyWall_explainer.mp4
