# يبني التطبيق ويفحصه على ويندوز وماك ولينكس في كل رفع إلى GitHub.
# الملفات الجاهزة تظهر في صفحة التشغيل (Actions → آخر تشغيل → Artifacts).
# وعند وسم نسخة (مثل: git tag v1.0 && git push --tags) تُنشر في صفحة Releases للتحميل المباشر.
name: Build apps

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14          # Apple Silicon (M1 وما بعده). MediaPipe لا يدعم ماك إنتل
            name: macos-apple-silicon
          - os: ubuntu-22.04      # glibc 2.35: يعمل على Ubuntu 22.04+ وما يماثلها
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Linux libraries (OpenGL / audio / Tk for the build and selftest)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libegl1 libasound2 python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build
        shell: bash
        env:
          WALL_ONEFILE: ${{ runner.os == 'macOS' && '0' || '1' }}
        run: python -m PyInstaller wall_app.spec --noconfirm --clean --distpath release

      - name: Selftest the built app
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          WALL_SELFTEST_OUT: ${{ github.workspace }}/selftest.txt
        run: |
          case "$RUNNER_OS" in
            Windows) ./release/TypographyWall.exe --selftest ;;
            macOS)   ./release/TypographyWall.app/Contents/MacOS/TypographyWall --selftest ;;
            Linux)   xvfb-run -a ./release/TypographyWall --selftest ;;   # شاشة وهمية لشاشة البداية
          esac
          cat selftest.txt
          grep -q "SELFTEST OK" selftest.txt

      - name: Show the app's error log (only when the selftest failed)
        if: failure()
        shell: bash
        run: |
          # يظهر الخطأ كتنبيه عام في صفحة التشغيل (السجل الكامل يحتاج تسجيل دخول)
          python - <<'EOF'
          import glob, os
          home = os.path.expanduser("~")
          for pattern in (os.path.join(os.environ.get("LOCALAPPDATA", ""), "TypographyWall", "**", "*.log"),
                          home + "/Library/Application Support/TypographyWall/**/*.log",
                          home + "/.local/share/TypographyWall/**/*.log"):
              for path in glob.glob(pattern, recursive=True):
                  text = open(path, encoding="utf-8", errors="replace").read()[-3500:]
                  text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={os.path.basename(path)}::{text}")
          EOF

      - name: Package
        shell: bash
        run: |
          mkdir out
          case "$RUNNER_OS" in
            Windows) cp release/TypographyWall.exe out/TypographyWall-windows.exe ;;
            macOS)   ditto -c -k --keepParent release/TypographyWall.app out/TypographyWall-macos-apple-silicon.zip ;;
            Linux)   tar -czf out/TypographyWall-linux-x64.tar.gz -C release TypographyWall ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: TypographyWall-${{ matrix.name }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
